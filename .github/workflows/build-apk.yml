name: Construire APK Garage Adriano

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          mkdir -p projet
          unzip -q Garage_Adriano_Application_V3-3.zip -d projet

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Construire l'APK
        run: |
          GRADLEW=$(find projet -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew introuvable"
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Garage-Adriano-APK
          path: |
            projet/**/build/outputs/apk/debug/*.apk
