name: Construire APK Garage Adriano

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v6

      - name: Décompresser le projet
        run: |
          unzip -q Garage_Adriano_Application_V3-3.zip -d projet

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire l'APK
        working-directory: projet/Garage_Adriano_Application_V3-3.4
        run: gradle assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Garage-Adriano-APK
          path: projet/app/build/outputs/apk/debug/app-debug.apk
